<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>單字遊戲生成器</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap');
        
        body {
            font-family: 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #4a4a4a;
        }
        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            position: relative;
            overflow: hidden;
        }
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 12px;
            background: linear-gradient(90deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
        }
        h1 {
            text-align: center;
            color: #ff6b6b;
            margin-bottom: 30px;
            font-size: 2.2em;
            font-weight: 800;
            text-shadow: 2px 2px 0px #ffe3e3;
            letter-spacing: 1px;
        }
        .form-group {
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 700;
            color: #5f27cd;
            font-size: 1.1em;
        }
        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #eee;
            border-radius: 14px;
            box-sizing: border-box;
            font-size: 1em;
            font-family: inherit;
            transition: all 0.3s ease;
            background-color: #f8f9fa;
        }
        input[type="text"]:focus, input[type="file"]:focus {
            outline: none;
            border-color: #5f27cd;
            box-shadow: 0 0 0 4px rgba(95, 39, 205, 0.15);
            background-color: #ffffff;
        }
        input[type="file"]::file-selector-button {
            background: #5f27cd;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-right: 15px;
            font-weight: bold;
            transition: background 0.2s;
        }
        input[type="file"]::file-selector-button:hover {
            background: #481fa8;
        }
        button {
            width: 100%;
            padding: 16px;
            background-color: #ff9f43;
            color: white;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-size: 1.2em;
            font-weight: 800;
            margin-top: 15px;
            transition: all 0.2s;
            box-shadow: 0 6px 0 #d35400;
            font-family: inherit;
            letter-spacing: 1px;
        }
        button:hover {
            background-color: #ffaa5e;
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #d35400;
        }
        button:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #d35400;
        }
        button:disabled {
            background-color: #cccccc;
            box-shadow: 0 6px 0 #999999;
            cursor: not-allowed;
            transform: translateY(0);
        }
        #message {
            margin-top: 25px;
            padding: 20px;
            border-radius: 14px;
            display: none;
            text-align: center;
            font-weight: bold;
            font-size: 1.05em;
            line-height: 1.5;
        }
        .success {
            background-color: #e8f8f5;
            color: #0e6251;
            border: 2px solid #a2d9ce;
        }
        .error {
            background-color: #fdedec;
            color: #7b241c;
            border: 2px solid #f5b7b1;
        }
        .loading {
            text-align: center;
            display: none;
            margin-top: 20px;
            color: #ff9f43;
            font-weight: bold;
            animation: pulse 1.5s infinite;
            font-size: 1.1em;
        }
        @keyframes pulse {
            0% { opacity: 0.5; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
            100% { opacity: 0.5; transform: scale(0.98); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>單字遊戲生成器</h1>
    <form id="generatorForm">
        <div class="form-group">
            <label for="examName">單元名稱</label>
            <input type="text" id="examName" name="exam_name" placeholder="例如: YLE" required>
        </div>
        
        <div class="form-group">
            <label for="vocabCsv">單元單字表 (CSV 格式)</label>
            <input type="file" id="vocabCsv" name="vocab_csv" accept=".csv" required>
        </div>
        
        <div class="form-group">
            <label for="articleFile">文章檔案 (PDF 或 Markdown 格式)</label>
            <input type="file" id="articleFile" name="article_file" accept=".pdf,.md" required>
        </div>
        
        <button type="submit" id="submitBtn">開始生成</button>
        <div class="loading" id="loading">處理中，這可能需要幾分鐘時間...</div>
    </form>
    
    <div id="message"></div>
</div>

<script>
    // 簡易 CSV 解析器，用於前端檢查標頭
    function parseCSVHeader(text) {
        const firstLine = text.split('\n')[0];
        if (!firstLine) return [];
        return firstLine.split(',').map(h => h.trim().replace(/^["']|["']$/g, '').toLowerCase());
    }

    document.getElementById('generatorForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const form = e.target;
        const formData = new FormData(form);
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const messageDiv = document.getElementById('message');
        
        // 1. 前端防呆：檢查 CSV 欄位
        const csvFile = document.getElementById('vocabCsv').files[0];
        if (csvFile) {
            try {
                const text = await csvFile.text();
                const headers = parseCSVHeader(text);
                // 檢查是否包含必要的 'word' 欄位 (可視需求增加 'chinese' 等)
                if (!headers.includes('word')) {
                    messageDiv.style.display = 'block';
                    messageDiv.className = 'error';
                    messageDiv.textContent = '哎呀！上傳的 CSV 缺少必要的 "Word" 欄位，請檢查檔案格式後再試。';
                    return; // 阻擋上傳
                }
            } catch (err) {
                console.error("CSV 讀取失敗", err);
            }
        }

        // 準備 UI 狀態
        submitBtn.disabled = true;
        loading.style.display = 'block';
        messageDiv.style.display = 'none';
        messageDiv.className = '';
        
        try {
            // 假設後端運行在 http://localhost:8000
            const response = await fetch('http://localhost:8000/api/generate', {
                method: 'POST',
                body: formData
            });
            
            // 2. 處理後端回傳的 500 等錯誤
            if (!response.ok) {
                throw new Error(`伺服器發生錯誤 (狀態碼: ${response.status})`);
            }

            const result = await response.json();
            
            if (result.status === 'success') {
                messageDiv.className = 'success';
                messageDiv.innerHTML = `
                    <strong>${result.message}</strong><br>
                    已生成: ${result.file}<br><br>
                    <a href="../index.html?unit=${result.exam_name}" style="display:inline-block; padding:8px 15px; background:#007bff; color:white; text-decoration:none; border-radius:4px;">前往遊戲</a>
                `;
            } else {
                messageDiv.className = 'error';
                messageDiv.textContent = result.message || '發生未知錯誤';
            }
        } catch (error) {
            // 3. 友善的錯誤提示，避免畫面卡死
            messageDiv.className = 'error';
            messageDiv.innerHTML = `<strong>哎呀！處理失敗了。</strong><br>可能原因：<br>1. 文章解析失敗 (請確認上傳的是有效的 PDF 或 Markdown 檔)<br>2. 後端伺服器未啟動 (http://localhost:8000)<br><br><span style="font-size:0.8em;color:#999;">系統錯誤訊息: ${error.message}</span>`;
        } finally {
            // 4. 確保按鈕恢復狀態
            submitBtn.disabled = false;
            loading.style.display = 'none';
            messageDiv.style.display = 'block';
        }
    });
</script>

</body>
</html>
